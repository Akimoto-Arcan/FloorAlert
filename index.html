<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FloorAlert — Maintenance Communication & Ticketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        surface: { 50:'#f8fafc', 100:'#f1f5f9', 200:'#e2e8f0', 300:'#cbd5e1', 400:'#94a3b8', 500:'#64748b', 600:'#475569', 700:'#334155', 800:'#1e293b', 850:'#172033', 900:'#0f172a', 950:'#020617' },
                        accent: { 300:'#6ee7b7', 400:'#34d399', 500:'#10b981', 600:'#059669', 700:'#047857' },
                        warn: { 300:'#fcd34d', 400:'#fbbf24', 500:'#f59e0b', 600:'#d97706' },
                        danger: { 300:'#fca5a5', 400:'#f87171', 500:'#ef4444', 600:'#dc2626' },
                        info: { 300:'#7dd3fc', 400:'#38bdf8', 500:'#0ea5e9', 600:'#0284c7' },
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-surface-950 text-surface-100 font-sans antialiased min-h-screen">

    <!-- ════════════════════════════════════════════════════════════════════════ -->
    <!-- LANDING PAGE                                                        -->
    <!-- ════════════════════════════════════════════════════════════════════════ -->
    <div id="landingPage" class="min-h-screen flex flex-col">
        <!-- Landing Header -->
        <div class="bg-accent-600 text-white text-center text-xs py-1.5 px-4 font-medium tracking-wide">
            <span class="inline-flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"/></svg>
                Self-Hosted Demo — All data stored locally
            </span>
        </div>

        <!-- Landing Content -->
        <div class="flex-1 flex flex-col items-center justify-center px-4 sm:px-6 py-12 sm:py-16">
            <!-- Logo & Tagline -->
            <div class="text-center mb-10 sm:mb-14 fade-in">
                <div class="w-20 h-20 bg-accent-500 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-lg shadow-accent-500/30">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <h1 class="text-4xl sm:text-5xl font-bold text-white mb-3">FloorAlert</h1>
                <p class="text-lg sm:text-xl text-surface-400 max-w-md mx-auto">Maintenance communication that actually works</p>
            </div>

            <!-- Role Selection -->
            <div class="w-full max-w-2xl">
                <p class="text-center text-surface-400 text-sm mb-6">Which user would you like to preview as?</p>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Floor Worker -->
                    <button onclick="App.enterAsRole('floor_worker')" class="landing-card group bg-surface-900 border-2 border-surface-800 hover:border-accent-500/50 rounded-2xl p-6 text-left transition-all duration-300 hover:shadow-lg hover:shadow-accent-500/10 hover:-translate-y-1">
                        <div class="w-14 h-14 bg-accent-500/10 group-hover:bg-accent-500/20 rounded-xl flex items-center justify-center mb-4 transition-colors">
                            <svg class="w-7 h-7 text-accent-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-1">Floor Worker</h3>
                        <p class="text-sm text-surface-400 leading-relaxed">Report incidents from the floor in under 30 seconds. No paper, no forms, no fuss.</p>
                    </button>

                    <!-- Technician -->
                    <button onclick="App.enterAsRole('technician')" class="landing-card group bg-surface-900 border-2 border-surface-800 hover:border-info-500/50 rounded-2xl p-6 text-left transition-all duration-300 hover:shadow-lg hover:shadow-info-500/10 hover:-translate-y-1">
                        <div class="w-14 h-14 bg-info-500/10 group-hover:bg-info-500/20 rounded-xl flex items-center justify-center mb-4 transition-colors">
                            <svg class="w-7 h-7 text-info-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-1">Technician</h3>
                        <p class="text-sm text-surface-400 leading-relaxed">View and update work orders, track assets, and stay on top of your queue.</p>
                    </button>

                    <!-- Manager -->
                    <button onclick="App.enterAsRole('manager')" class="landing-card group bg-surface-900 border-2 border-surface-800 hover:border-warn-500/50 rounded-2xl p-6 text-left transition-all duration-300 hover:shadow-lg hover:shadow-warn-500/10 hover:-translate-y-1">
                        <div class="w-14 h-14 bg-warn-500/10 group-hover:bg-warn-500/20 rounded-xl flex items-center justify-center mb-4 transition-colors">
                            <svg class="w-7 h-7 text-warn-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-1">Manager</h3>
                        <p class="text-sm text-surface-400 leading-relaxed">Full visibility — incidents, work orders, assets, PMs, and team performance.</p>
                    </button>

                    <!-- Admin -->
                    <button onclick="App.enterAsRole('admin')" class="landing-card group bg-surface-900 border-2 border-surface-800 hover:border-danger-500/50 rounded-2xl p-6 text-left transition-all duration-300 hover:shadow-lg hover:shadow-danger-500/10 hover:-translate-y-1">
                        <div class="w-14 h-14 bg-danger-500/10 group-hover:bg-danger-500/20 rounded-xl flex items-center justify-center mb-4 transition-colors">
                            <svg class="w-7 h-7 text-danger-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-1">Admin</h3>
                        <p class="text-sm text-surface-400 leading-relaxed">Complete control — users, settings, integrations, and system configuration.</p>
                    </button>
                </div>
            </div>

            <!-- LAN Setup Info -->
            <div class="w-full max-w-2xl mt-8">
                <button onclick="App.showLANSetup()" class="w-full bg-surface-900/50 border border-surface-800 hover:border-accent-500/30 rounded-2xl p-5 text-left transition-all duration-300 hover:shadow-lg hover:shadow-accent-500/5">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-accent-500/10 rounded-xl flex items-center justify-center flex-shrink-0">
                            <svg class="w-6 h-6 text-accent-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"/></svg>
                        </div>
                        <div>
                            <h3 class="text-base font-bold text-white mb-1">Self-Hosted LAN Setup</h3>
                            <p class="text-sm text-surface-400">No cloud, no internet required. Run on your own network. Click to see how it works.</p>
                        </div>
                    </div>
                </button>
            </div>

            <!-- Footer -->
            <div class="mt-12 text-center">
                <p class="text-xs text-surface-600">FloorAlert v1.0 — Demo Build · Built by Chris Carpenter</p>
            </div>
        </div>
    </div>

    <!-- ════════════════════════════════════════════════════════════════════════ -->
    <!-- MAIN APP (hidden until role selected)                               -->
    <!-- ════════════════════════════════════════════════════════════════════════ -->
    <div id="mainApp" class="hidden">
        <!-- Self-Hosted Banner -->
        <div id="selfHostedBanner" class="bg-accent-600 text-white text-center text-xs py-1.5 px-4 font-medium tracking-wide">
            <span class="inline-flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"/></svg>
                Self-Hosted Mode — All data stored locally on this device
            </span>
        </div>

        <!-- Header -->
        <header class="bg-surface-900/95 backdrop-blur-md border-b border-surface-800 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6">
                <div class="flex items-center justify-between h-14">
                    <!-- Logo -->
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 bg-accent-500 rounded-lg flex items-center justify-center">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                        </div>
                        <span class="text-lg font-bold text-white hidden sm:block">FloorAlert</span>
                    </div>

                    <!-- Header Actions -->
                    <div class="flex items-center gap-2 sm:gap-3">
                        <!-- Dashboard -->
                        <button onclick="App.navigate('dashboard')" class="p-2 rounded-lg hover:bg-surface-800 transition-colors text-surface-400 hover:text-surface-200" title="Back to Dashboard">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                        </button>
                        <!-- Back to Role Selection -->
                        <button onclick="App.showLanding()" class="p-2 rounded-lg hover:bg-surface-800 transition-colors text-surface-400 hover:text-surface-200" title="Back to Role Selection">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 17l-5-5m0 0l5-5m-5 5h12"/></svg>
                        </button>

                        <!-- Role Switcher -->
                        <div class="relative">
                            <select id="roleSwitcher" class="appearance-none bg-surface-800 border border-surface-700 text-surface-200 text-xs sm:text-sm rounded-lg pl-3 pr-8 py-1.5 focus:outline-none focus:ring-2 focus:ring-accent-500 cursor-pointer">
                                <option value="floor_worker">Floor Worker</option>
                                <option value="technician">Technician</option>
                                <option value="manager">Manager</option>
                                <option value="admin">Admin</option>
                            </select>
                            <svg class="w-4 h-4 text-surface-400 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </div>

                        <!-- More (desktop) -->
                        <button onclick="App.navigate('more')" class="p-2 rounded-lg hover:bg-surface-800 transition-colors text-surface-400 hover:text-surface-200" title="More">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                        </button>
                        <!-- Notification Bell -->
                        <button id="notifBell" class="relative p-2 rounded-lg hover:bg-surface-800 transition-colors" onclick="App.toggleNotifications()">
                            <svg class="w-5 h-5 text-surface-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                            <span id="notifBadge" class="absolute -top-0.5 -right-0.5 w-4 h-4 bg-danger-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center hidden">0</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Notification Panel -->
        <div id="notifPanel" class="fixed inset-0 z-50 hidden">
            <div class="absolute inset-0 bg-black/50" onclick="App.toggleNotifications()"></div>
            <div class="absolute right-0 top-0 h-full w-full sm:w-96 bg-surface-900 border-l border-surface-800 shadow-2xl overflow-y-auto">
                <div class="p-4 border-b border-surface-800 flex items-center justify-between sticky top-0 bg-surface-900 z-10">
                    <h3 class="font-semibold text-white">Notifications</h3>
                    <button onclick="App.toggleNotifications()" class="p-1 hover:bg-surface-800 rounded-lg transition-colors">
                        <svg class="w-5 h-5 text-surface-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <div id="notifList" class="divide-y divide-surface-800"></div>
            </div>
        </div>

        <!-- Main Content -->
        <main id="mainContent" class="max-w-7xl mx-auto px-4 sm:px-6 pb-24 sm:pb-8 pt-6">
            <!-- Views will be rendered here by JS -->
        </main>

        <!-- Bottom Navigation (Mobile) -->
        <nav class="fixed bottom-0 left-0 right-0 bg-surface-900/95 backdrop-blur-md border-t border-surface-800 z-40">
            <div class="flex items-center justify-around h-16">
                <button onclick="App.navigate('report')" class="nav-btn flex flex-col items-center gap-0.5 px-3 py-1 text-surface-400 hover:text-accent-400 transition-colors" data-nav="report">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span class="text-[10px]">Report</span>
                </button>
                <button onclick="App.navigate('dashboard')" class="nav-btn flex flex-col items-center gap-0.5 px-3 py-1 text-surface-400 hover:text-accent-400 transition-colors" data-nav="dashboard">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    <span class="text-[10px]">Dashboard</span>
                </button>
                <button onclick="App.navigate('workorders')" class="nav-btn flex flex-col items-center gap-0.5 px-3 py-1 text-surface-400 hover:text-accent-400 transition-colors" data-nav="workorders">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                    <span class="text-[10px]">Orders</span>
                </button>
                <button onclick="App.navigate('assets')" class="nav-btn flex flex-col items-center gap-0.5 px-3 py-1 text-surface-400 hover:text-accent-400 transition-colors" data-nav="assets">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                    <span class="text-[10px]">Assets</span>
                </button>
                <button onclick="App.navigate('more')" class="nav-btn flex flex-col items-center gap-0.5 px-3 py-1 text-surface-400 hover:text-accent-400 transition-colors" data-nav="more">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    <span class="text-[10px]">More</span>
                </button>
            </div>
        </nav>

        <!-- Toast Container -->
        <div id="toastContainer" class="fixed bottom-20 sm:bottom-6 right-4 z-50 flex flex-col gap-2"></div>
    </div>

    <!-- Modal Container (always visible, even on landing page) -->
    <div id="modalContainer" style="position: relative; z-index: 9999;"></div>

    <script src="app.js"></script>
</body>
</html>
